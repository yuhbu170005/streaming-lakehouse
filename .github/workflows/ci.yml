name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
      - run: make sync
      - run: make lint
      - run: make test

  kafka-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
      - run: make sync
      - run: make topics
      - run: make test
        env:
          RUN_KAFKA_INTEGRATION: "1"
      - if: always()
        run: make down

  dbt-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
      - run: uv sync --locked --group operations
      - run: uv run --locked --group operations dbt parse --project-dir dbt_project --profiles-dir dbt_project
      - run: uv run --locked --group operations dbt --no-populate-cache compile --no-introspect --project-dir dbt_project --profiles-dir dbt_project
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiled-dbt-and-docs
          path: |
            docs/*.md
            dbt_project/target/manifest.json
            dbt_project/target/compiled/
