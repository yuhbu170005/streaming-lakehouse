global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [alerts.yml]
scrape_configs:
  - job_name: producer
    static_configs:
      - targets: [producer:9108]
  - job_name: spark
    static_configs:
      - targets: [bronze:9110, silver:9110, gold:9110, reference:9110]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: [redpanda:9644]
  - job_name: warehouse
    static_configs:
      - targets: [warehouse-metrics:9111]
