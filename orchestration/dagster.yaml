telemetry:
  enabled: false
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 1
storage:
  postgres:
    postgres_db:
      username: lakehouse
      password:
        env: POSTGRES_PASSWORD
      hostname: postgres
      scheme: postgresql+psycopg2
      db_name: dagster
      port: 5432
run_monitoring:
  enabled: true
  start_timeout_seconds: 120
  max_runtime_seconds: 600
