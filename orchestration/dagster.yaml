telemetry:
  enabled: false
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 1
storage:
  postgres:
    postgres_db:
      username: lakehouse
      password:
        env: POSTGRES_PASSWORD
      hostname: postgres
      db_name: dagster
      port: 5432
